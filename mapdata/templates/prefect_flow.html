<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jsPlumb 流程图编辑器</title>
  <link href="{{ static_url }}/tailwind.css" rel="stylesheet">
  <script src="{{static_url }}/js/jsplumb.min.js"></script>
<style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    #canvas {
      width: 100%;
      height: 400px;
      border: 1px solid #ccc;
      position: relative;
      overflow: hidden;
    }
    .node {
      width: 100px;
      height: 50px;
      line-height: 50px;
      text-align: center;
      border: 1px solid #666;
      background-color: lightblue;
      position: absolute;
      cursor: move;
    }
    #editor {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #ccc;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    #editor input, #editor select, #editor button {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div>
    <button onclick="addNode()">添加节点</button>
    <button onclick="exportData()">导出 JSON</button>
    <button onclick="importData()">导入 JSON</button>
  </div>
  <div id="canvas"></div>
  <div id="editor">
    <label>
      节点名称：
      <input type="text" id="nodeName" disabled />
    </label>
    <label>
      节点属性：
      <select id="nodeAttribute" disabled>
        <option value="option1">属性1</option>
        <option value="option2">属性2</option>
        <option value="option3">属性3</option>
      </select>
    </label>
    <button onclick="saveNode()" disabled id="saveButton">保存</button>
  </div>
  <script src="{{static_url }}/js/flowplumb.js"></script>
</body>
</html>
