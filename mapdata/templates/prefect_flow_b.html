<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fabric.js 流程图编辑器</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      border: 1px solid #ccc;
    }
    .toolbar {
      margin-bottom: 10px;
    }
    .toolbar button {
      margin-right: 5px;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button onclick="addRectangle()">添加矩形</button>
    <button onclick="addCircle()">添加圆形</button>
    <button onclick="exportJSON()">导出 JSON</button>
    <button onclick="importJSON()">导入 JSON</button>
    <button onclick="deleteSelected()">删除选中对象</button>
  </div>
  <canvas id="canvas" width="800" height="600"></canvas>
  <input type="file" id="jsonFile" style="display: none;" />
  <script src="{{static_url }}/js/flowchart.js"></script>
</body>
</html>
