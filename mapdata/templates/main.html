<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}束水智能{% endblock %}</title>
    <link href="{{ static_url }}/tailwind.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
<!-- 导航栏 -->
<div class="navbar bg-blue-600 text-white shadow-md">
    <div class="container mx-auto flex items-center justify-between py-4 px-6">
        <div class="text-2xl font-bold">
            <a href="/">束水智能</a>
        </div>
        <nav class="flex space-x-6">
            <a href="/" class="hover:text-blue-300 transition duration-200">主页</a>
            <a href="/about" class="hover:text-blue-300 transition duration-200">关于</a>
            <a href="/services" class="hover:text-blue-300 transition duration-200">服务</a>
            <a href="/contact" class="hover:text-blue-300 transition duration-200">联系我们</a>
            <a href="/image_upload" class="hover:text-blue-300 transition duration-200">处理图片</a>
            <a href="/flow_list" class="hover:text-blue-300 transition duration-200">流程管理</a>
            <a href="/models" class="hover:text-blue-300 transition duration-200">模型管理</a>
        </nav>
    </div>
</div>

<!-- 内容区域 -->
<div class="content flex-grow container mx-auto mt-12 px-6">
    <h1 class="text-4xl font-extrabold text-gray-800 mb-4">{{ title }}</h1>
    <p class="text-gray-600 text-lg leading-relaxed">{{ content }}</p>
</div>

<!-- 页脚 -->
<footer class="bg-gray-800 text-gray-400 py-6 mt-12">
    <div class="container mx-auto text-center">
        <p class="text-sm">&copy; 2025 束水智能 保留所有权利。</p>
    </div>
</footer>
</body>
</html>
