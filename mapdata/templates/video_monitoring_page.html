<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTSP 视频监控页面</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center;
        }
        h1 {
            text-align: center;
            margin-bottom: 40px;
        }
        .video-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .video-player {
            width: 30%;
            border: 1px solid #ccc;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .video-player video {
            width: 100%;
            height: auto;
        }
        .video-title {
            padding: 10px;
            font-weight: bold;
            background-color: #f8f9fa;
            border-top: 1px solid #ccc;
            text-align: center;
        }
    </style>
</head>
<script src="../static/js/adapter.min.js"></script>
<script src="../static/js/webrtcstreamer.js"></script>
<body>
    <h1>实时监控视频流</h1>
    <div class="video-container">
        <h1>{{ stream }}</h1>
        <div class="video-player">
            <video controls autoplay muted id="video">
                <source src="{{ stream }}" type="application/x-mpegURL">
                您的浏览器不支持视频播放。
            </video>
            <div class="video-title">{{ stream }}</div>
        </div>
    </div>
</body>

<script>
    // 定义 stream 值为模板语言注入的变量
	var stream = "{{ stream | safe }}"; // 确保 `stream` 是合法字符串并适合插入到前端。
	var webRtcServer      = null;
	window.onload         = function() {
		webRtcServer      = new WebRtcStreamer("video","http://192.168.0.70:8000");
		webRtcServer.connect(stream);
	}
	window.onbeforeunload = function() { webRtcServer.disconnect(); }
</script>
</html>
